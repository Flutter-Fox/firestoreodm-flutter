name: cloud_firestore_odm_example
publish_to: none

environment:
  sdk: ">=2.18.0 <4.0.0"

dependencies:
  cloud_firestore: ">=6.0.1 <7.0.0"
  cloud_firestore_odm: ^1.0.0-dev.85
  firebase_core: ">=4.0.0 <5.0.0"
  flutter:
    sdk: flutter
  freezed_annotation: ">=3.0.0 <4.0.0"
  json_annotation: ">=4.9.0 <5.0.0"
  meta: ^1.12.0

dev_dependencies:
  build_runner: ^2.7.1
  cloud_firestore_odm_generator:
    path: ../../cloud_firestore_odm_generator
  cloud_firestore_odm_generator_integration_test:
    path: ../../cloud_firestore_odm_generator/cloud_firestore_odm_generator_integration_test
  flutter_test:
    sdk: flutter
  freezed: ">=3.2.0 <4.0.0"
  http: ^1.0.0
  integration_test:
    sdk: flutter
  json_serializable: ">=6.3.0 <7.0.0"
  mockito: ^5.0.0

dependency_overrides:
  cloud_firestore_odm:
    path: ../
  analyzer: "7.7.1"
  dart_style: "3.1.1"
  source_gen: "3.1.0"

flutter:
  uses-material-design: true
